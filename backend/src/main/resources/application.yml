server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dashboard_builder
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  jwt:
    secret: dashboard-builder-secret-key-that-is-at-least-256-bits-long-for-hs256
    expiration: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
